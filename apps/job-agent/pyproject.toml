[project]
name = "job-agent"
version = "0.1.0"
description = "ATS job scraping agent (Greenhouse, Lever)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "lxml>=5.0.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
